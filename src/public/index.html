<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Administrativo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f7fa;
      display: flex;
      height: 100vh;
    }

    /* Menu lateral */
    aside {
      width: 220px;
      background-color: #1e1e2f;
      color: white;
      padding: 20px;
    }

    aside h2 {
      margin-top: 0;
      font-size: 20px;
      text-align: center;
    }

    aside nav a {
      display: block;
      margin: 15px 0;
      text-decoration: none;
      color: white;
      padding: 10px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    aside nav a:hover {
      background-color: #2d2d4f;
    }

    main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    section {
      margin-bottom: 50px;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    section h3 {
      margin-top: 0;
      color: #333;
    }

    form {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 10px;
      font-size: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>

  <aside>
    <h2>Admin Panel</h2>
    <nav>
      <a href="#usuarios">👤 Usuários</a>
      <a href="#produtos">📦 Produtos</a>
      <a href="#pedidos">📝 Pedidos</a>
    </nav>
  </aside>

  <main>
    <!-- Usuários -->
    <section id="usuarios">
      <h3>Gerenciar Usuários</h3>
      <form>
        <input type="text" placeholder="Nome" required>
        <input type="email" placeholder="Email" required>
        <button type="submit">Cadastrar</button>
      </form>
      <table>
        <thead>
          <tr><th>Nome</th><th>Email</th><th>Ações</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Maria Silva</td>
            <td>maria@email.com</td>
            <td><button>Editar</button> <button>Excluir</button></td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Produtos -->
    <section id="produtos">
      <h3>Gerenciar Produtos</h3>
      <form>
        <input type="text" placeholder="Produto" required>
        <input type="number" placeholder="Preço" min="0" step="0.01" required>
        <button type="submit">Cadastrar</button>
      </form>
      <table>
        <thead>
          <tr><th>Produto</th><th>Preço</th><th>Ações</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Camiseta Azul</td>
            <td>R$ 39,90</td>
            <td><button>Editar</button> <button>Excluir</button></td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Pedidos -->
    <section id="pedidos">
      <h3>Gerenciar Pedidos</h3>
      <form>
        <select required>
          <option value="">Selecione o usuário</option>
        </select>
        <select required>
          <option value="">Selecione o produto</option>
        </select>
        <input type="number" placeholder="Quantidade" min="1" required>
        <button type="submit">Criar Pedido</button>
      </form>
      <table>
        <thead>
          <tr><th>Usuário</th><th>Produto</th><th>Quantidade</th><th>Ações</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>João</td>
            <td>Boné</td>
            <td>2</td>
            <td><button>Editar</button> <button>Excluir</button></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

</body>
</html>
