<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Vendas - Gerenciador</title>
</head>
<body>
  <h1>Sistema de Vendas - Gerenciador</h1>

  <nav>
    <button onclick="showTab('users')">Usuários</button>
    <button onclick="showTab('products')">Produtos</button>
    <button onclick="showTab('orders')">Pedidos</button>
  </nav>

  <section id="users" style="display:block">
    <h2>Usuários</h2>
    <form id="user-form">
      <input type="text" id="user-name" placeholder="Nome" required />
      <input type="email" id="user-email" placeholder="Email" required />
      <button type="submit">Adicionar Usuário</button>
    </form>
    <ul id="user-list"></ul>
  </section>

  <section id="products" style="display:none">
    <h2>Produtos</h2>
    <form id="product-form">
      <input type="text" id="product-name" placeholder="Produto" required />
      <input type="number" id="product-price" placeholder="Preço" required />
      <button type="submit">Adicionar Produto</button>
    </form>
    <ul id="product-list"></ul>
  </section>

  <section id="orders" style="display:none">
    <h2>Pedidos</h2>
    <form id="order-form">
      <select id="order-user"></select>
      <select id="order-product"></select>
      <input type="number" id="order-quantity" placeholder="Quantidade" required />
      <button type="submit">Criar Pedido</button>
    </form>
    <ul id="order-list"></ul>
  </section>

  <script>
    const tabs = ['users', 'products', 'orders'];

    function showTab(tab) {
      tabs.forEach(t => {
        document.getElementById(t).style.display = t === tab ? 'block' : 'none';
      });
    }

    // Você pode adaptar o JavaScript conforme os endpoints da sua API
  </script>
</body>
</html>
